[/Script/Engine.DataDrivenConsoleVariableSettings]
; The DDCvar.* console variables SandboxCharacter_CMC_ABP reads by name through
; Blueprint GetConsoleVariable*Value nodes. Every default is 0, the value a missing
; name reads, so at their defaults these entries only silence the lookup warnings.
; The engine-owned name the AnimBP also reads must not be added here. Edit these
; entries here, not through Project Settings, which would write the project config
; instead.
+CVarsArray=(Type=CVarInt,Name="DDCvar.MMDatabaseLOD",DefaultValueInt=0)
+CVarsArray=(Type=CVarFloat,Name="DDCvar.OffsetRootBone.TranslationRadius",DefaultValueFloat=0.000000)
+CVarsArray=(Type=CVarInt,Name="DDCVar.ThreadSafeAnimationUpdate.Enable",DefaultValueInt=0)
+CVarsArray=(Type=CVarInt,Name="DDCVar.ExperimentalStateMachine.Enable",DefaultValueInt=0)
+CVarsArray=(Type=CVarInt,Name="DDCVar.LocomotionSetupCMC",DefaultValueInt=0)
+CVarsArray=(Type=CVarInt,Name="DDCvar.DrawCharacterDebugShapes",DefaultValueInt=0)
+CVarsArray=(Type=CVarInt,Name="DDCvar.DrawCharacterDebugStates",DefaultValueInt=0)
+CVarsArray=(Type=CVarInt,Name="DDCvar.DrawCharacterDebugGraphs",DefaultValueInt=0)
