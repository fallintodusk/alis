; =============================================================================
; Alis Project Scalability Overrides (SOT)
; =============================================================================
;
; PROBLEM:
;   CVars in DefaultEngine.ini get priority "SetByProjectSetting".
;   UE's scalability system (BaseScalability.ini) uses "SetByScalability".
;   ProjectSetting > Scalability = conflict warning spam on every launch.
;
; SOLUTION:
;   Move quality CVars HERE. This file merges with BaseScalability.ini.
;   Same priority level = no conflict. Clean logs.
;
; WHY LOCKED AT ALL LEVELS (@0 through @Cine):
;   These are ARTISTIC decisions, not performance scaling:
;   - Motion blur OFF: cleaner gameplay, no smearing
;   - Bloom OFF: realistic lighting, no glow
;   - Chromatic aberration OFF: clean image, no color fringing
;   - AO reduced: brighter scenes, less dark corners
;   - Shadows/SSR/Lumen: tuned for RTX 3060 baseline
;
;   If you want these to SCALE with user quality settings, set different
;   values at each @level instead of the same value.
;
; REFERENCE:
;   Engine defaults: UE_PATH/Engine/Config/BaseScalability.ini (see scripts/config/ue_path.conf)
;   UE priority order (low to high):
;     SetByConstructor < SetByScalability < SetByGameSetting <
;     SetByProjectSetting < SetByDeviceProfile < SetByConsole
;
; =============================================================================

; =============================================================================
; POST PROCESS - Artistic choices (locked at all levels)
; =============================================================================
; r.MotionBlurQuality: 0=off, 1-4=quality levels
;   Engine default @0=0, @1+=3-4. We lock to 0 (disabled).
;
; r.BloomQuality: 0=off, 4-5=normal
;   Engine default @0=4, @1+=4-5. We lock to 0 (disabled).
;
; r.SceneColorFringeQuality: 0=off, 1=on (chromatic aberration)
;   Engine default @0-1=0, @2+=1. We lock to 0 (disabled).
;
; r.AmbientOcclusionMaxQuality: 0-100 (percentage)
;   Engine default @0=0, @1=60, @2=100. We lock to 50 (reduced darkness).
;
; r.AmbientOcclusionLevels: 0=off, -1=auto, 1-3=fixed levels
;   Engine default @0=0, @1+=-1. We lock to 2 (medium, consistent).

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.BloomQuality=0
r.SceneColorFringeQuality=0
r.AmbientOcclusionMaxQuality=50
r.AmbientOcclusionLevels=2

[PostProcessQuality@1]
r.MotionBlurQuality=0
r.BloomQuality=0
r.SceneColorFringeQuality=0
r.AmbientOcclusionMaxQuality=50
r.AmbientOcclusionLevels=2

[PostProcessQuality@2]
r.MotionBlurQuality=0
r.BloomQuality=0
r.SceneColorFringeQuality=0
r.AmbientOcclusionMaxQuality=50
r.AmbientOcclusionLevels=2

[PostProcessQuality@3]
r.MotionBlurQuality=0
r.BloomQuality=0
r.SceneColorFringeQuality=0
r.AmbientOcclusionMaxQuality=50
r.AmbientOcclusionLevels=2

[PostProcessQuality@Cine]
r.MotionBlurQuality=0
r.BloomQuality=0
r.SceneColorFringeQuality=0
r.AmbientOcclusionMaxQuality=50
r.AmbientOcclusionLevels=2

; =============================================================================
; SHADOWS - High quality VSM for soft shadows (locked)
; =============================================================================
; r.Shadow.Virtual.SMRT.RayCountDirectional: 0-16 rays for directional light
;   Engine default @0=0, @1=4, @2-3=8, @Cine=16. We lock to 8 (high quality).
;
; r.Shadow.Virtual.SMRT.SamplesPerRayDirectional: 2-8 samples per ray
;   Engine default @0-1=2, @2-3=4, @Cine=8. We lock to 4 (smooth penumbras).
;
; Why locked: Soft shadow quality is core to Alis visual style.
; RTX 3060 handles 8/4 without performance issues.

[ShadowQuality@0]
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4

[ShadowQuality@1]
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4

[ShadowQuality@2]
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4

[ShadowQuality@3]
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4

[ShadowQuality@Cine]
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4

; =============================================================================
; REFLECTIONS - SSR at quality 2 (medium, 3060 friendly)
; =============================================================================
; r.SSR.Quality: 0=off, 1=low, 2=medium, 3=high, 4=very high
;   Engine default @0=0, @1-2=2, @3=3, @Cine=4. We lock to 2 (medium).
;
; Why locked: SSR quality 2 provides good reflections without GPU strain.
; Higher values cause performance issues on mid-range GPUs.

[ReflectionQuality@0]
r.SSR.Quality=2

[ReflectionQuality@1]
r.SSR.Quality=2

[ReflectionQuality@2]
r.SSR.Quality=2

[ReflectionQuality@3]
r.SSR.Quality=2

[ReflectionQuality@Cine]
r.SSR.Quality=2

; =============================================================================
; GLOBAL ILLUMINATION - Lumen always enabled
; =============================================================================
; r.Lumen.DiffuseIndirect.Allow: 0=disabled, 1=enabled
;   Engine default @0-1=0 (disabled at low), @2+=1 (enabled at medium+).
;   We lock to 1 (always enabled).
;
; Why locked: Lumen GI is essential for Alis lighting. Without it, interiors
; are too dark and outdoor lighting lacks bounce. Even low-end users need it.

[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=1

[GlobalIlluminationQuality@1]
r.Lumen.DiffuseIndirect.Allow=1

[GlobalIlluminationQuality@2]
r.Lumen.DiffuseIndirect.Allow=1

[GlobalIlluminationQuality@3]
r.Lumen.DiffuseIndirect.Allow=1

[GlobalIlluminationQuality@Cine]
r.Lumen.DiffuseIndirect.Allow=1
