[/Script/ProjectLoading.ProjectLoadingSettings]
; ===== Loading Pipeline Configuration =====
; Controls Phase 2 behavior in the 6-phase loading pipeline
;
; Phase 2 (MountContent) is now reserved - Orchestrator handles all plugin mounting
; during boot, before loading pipeline starts. This setting kept for compatibility.
bMountContentPacksOnly=true

[/Script/ProjectLoadingMoviePlayer.ProjectLoadingMoviePlayerSettings]
; MoviePlayer-backed loading screen widget. Must be GameInstance-safe (no player controller dependency).
LoadingScreenWidgetClass=/Script/ProjectUI.W_LoadingScreen
; MUST be true for World Partition maps - MoviePlayer auto-stop triggers before streaming completes
; We manually stop when BOTH pipeline AND map are loaded (see TryStopLoadingScreen)
bWaitForManualStop=true
MinimumDisplayTime=0.0
