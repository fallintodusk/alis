[/Script/ProjectBoot.ProjectBootSettings]
BootMap=/Game/Project/Maps/Boot/L_OrchestratorBoot
BootFlowControllerClass=/Script/ProjectBoot.ProjectBootFlowController
bAutoSetDefaultMap=True
bAutoAddBootWidget=True

; ===== Launcher-Driven Boot Configuration =====
; Controls whether Orchestrator manages feature plugins
; Set to true to enable Launcher-driven boot (Launcher -> Orchestrator -> Feature Modules)
; Set to false to use legacy ProjectLoading activation
bUseOrchestratorForFeatures=true

; Dev mode: When true, Orchestrator reads manifest from Launcher IPC context
; When false, Orchestrator uses Plugins/Boot/Orchestrator/Data/dev_manifest.json
bUseLauncherIPC=false

; Production: Launcher handles all manifest verification and downloads
; This setting is only used in dev mode (when bUseLauncherIPC=false)
bDevModeVerifyManifest=false
